name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Validate release version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tagVersion = "${{ github.ref_name }}" -replace '^v', ''
          if ($packageVersion -ne $tagVersion) {
            throw "Tag version $tagVersion does not match package version $packageVersion."
          }

      - name: Install dependencies
        shell: pwsh
        run: npm ci

      - name: Install Electron runtime
        shell: pwsh
        run: npm run electron:install

      - name: Validate and test
        shell: pwsh
        run: |
          npm run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run gui:build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:electron
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows installer
        shell: pwsh
        run: npm run dist:windows -- --publish never

      - name: Validate Windows release assets
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $assets = @(
            "release/heimdall-Setup-$version.exe",
            "release/heimdall-Setup-$version.exe.blockmap",
            "release/latest.yml"
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path $asset -PathType Leaf)) {
              throw "Missing release asset: $asset"
            }
          }

      - name: Stage Windows release assets
        shell: pwsh
        run: |
          $staging = "release-staging/windows"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Get-ChildItem -Path "release/heimdall-Setup-*.exe" -ErrorAction Stop |
            Copy-Item -Destination $staging
          Get-ChildItem -Path "release/heimdall-Setup-*.exe.blockmap" -ErrorAction Stop |
            Copy-Item -Destination $staging
          Copy-Item -Path "release/latest.yml" -Destination $staging -ErrorAction Stop

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v5
        with:
          name: windows-release
          path: release-staging/windows
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Validate release version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tagVersion = "${{ github.ref_name }}" -replace '^v', ''
          if ($packageVersion -ne $tagVersion) {
            throw "Tag version $tagVersion does not match package version $packageVersion."
          }

      - name: Install dependencies
        shell: pwsh
        run: npm ci

      - name: Validate and test
        shell: pwsh
        run: |
          npm run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run gui:build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:electron
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build macOS installers
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          $signingVariables = @(
            "CSC_LINK",
            "CSC_KEY_PASSWORD",
            "APPLE_ID",
            "APPLE_APP_SPECIFIC_PASSWORD",
            "APPLE_TEAM_ID"
          )
          foreach ($name in $signingVariables) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              Remove-Item -Path "Env:$name" -ErrorAction SilentlyContinue
            }
          }
          if (-not (Test-Path Env:CSC_LINK)) {
            $env:CSC_IDENTITY_AUTO_DISCOVERY = "false"
            Write-Output "Apple signing certificate is not configured; building unsigned macOS installers."
          }
          npm run dist:mac -- --publish never

      - name: Validate macOS release assets
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $assets = @(
            "release/heimdall-$version-mac-universal.dmg",
            "release/heimdall-$version-mac-universal.dmg.blockmap",
            "release/heimdall-$version-mac-universal.zip",
            "release/heimdall-$version-mac-universal.zip.blockmap",
            "release/latest-mac.yml"
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path $asset -PathType Leaf)) {
              throw "Missing release asset: $asset"
            }
          }

      - name: Stage macOS release assets
        shell: pwsh
        run: |
          $staging = "release-staging/macos"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          $assets = @(
            "release/heimdall-*-mac-universal.dmg",
            "release/heimdall-*-mac-universal.dmg.blockmap",
            "release/heimdall-*-mac-universal.zip",
            "release/heimdall-*-mac-universal.zip.blockmap",
            "release/latest-mac.yml"
          )
          foreach ($pattern in $assets) {
            $files = Get-ChildItem -Path $pattern -ErrorAction Stop
            if (-not $files) { throw "No files matched: $pattern" }
            $files | Copy-Item -Destination $staging
          }

      - name: Upload macOS release assets
        uses: actions/upload-artifact@v5
        with:
          name: macos-release
          path: release-staging/macos
          if-no-files-found: error

  publish:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v5
        with:
          pattern: "*-release"
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3.0.2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/heimdall-Setup-*.exe
            release-assets/heimdall-Setup-*.exe.blockmap
            release-assets/latest.yml
            release-assets/heimdall-*-mac-universal.dmg
            release-assets/heimdall-*-mac-universal.dmg.blockmap
            release-assets/heimdall-*-mac-universal.zip
            release-assets/heimdall-*-mac-universal.zip.blockmap
            release-assets/latest-mac.yml
